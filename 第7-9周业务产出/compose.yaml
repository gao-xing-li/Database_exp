services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_ADMIN_PASSWORD:?请设置DB_ADMIN_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - course_sql:/var/opt/mssql
volumes:
  course_sql:
