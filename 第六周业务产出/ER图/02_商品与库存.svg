<text x="128.0" y="1720.0000000000002" dominant-baseline="central" text-anchor="start" font-size="24.0" fill="#22334a" font-weight="400" text-decoration="none">图例：矩形为实体，菱形为联系；下划线为主码（多项合为联合主码）；AK / 同组 AK1 为候选码辅助标记。</text>
<text x="128.0" y="1768.0000000000002" dominant-baseline="central" text-anchor="start" font-size="24.0" fill="#22334a" font-weight="400" text-decoration="none">? 为原字段可空；/ 为派生属性；本端参与次数：1..1 恰好一次，0..1 可选一次，0..* 可选多次，1..* 至少一次。</text>
<text x="128.0" y="1816.0000000000002" dominant-baseline="central" text-anchor="start" font-size="24.0" fill="#22334a" font-weight="400" text-decoration="none">N 为条件附注；U1 为已验证的采购限制；Δ2 为整单到货仍有流程缺口。其他说明见本周数据字典。</text>
<text x="128.0" y="1888.0" dominant-baseline="central" text-anchor="start" font-size="24.0" fill="#34485e" font-weight="400" text-decoration="none">N01  角色非空则 IP 非空，角色与 IP 必须一致；v0.1 已有组合约束。</text>
<text x="128.0" y="1940.8" dominant-baseline="central" text-anchor="start" font-size="24.0" fill="#34485e" font-weight="400" text-decoration="none">N02  商品资料先于预售、采购；首次验收入库后必须有库存记录。</text>
