<text x="128.0" y="1752.0000000000002" dominant-baseline="central" text-anchor="start" font-size="24.0" fill="#22334a" font-weight="400" text-decoration="none">图例：矩形为实体，菱形为联系；下划线为主码（多项合为联合主码）；AK / 同组 AK1 为候选码辅助标记。</text>
<text x="128.0" y="1800.0000000000002" dominant-baseline="central" text-anchor="start" font-size="24.0" fill="#22334a" font-weight="400" text-decoration="none">? 为原字段可空；/ 为派生属性；本端参与次数：1..1 恰好一次，0..1 可选一次，0..* 可选多次，1..* 至少一次。</text>
<text x="128.0" y="1848.0000000000002" dominant-baseline="central" text-anchor="start" font-size="24.0" fill="#22334a" font-weight="400" text-decoration="none">N 为条件附注；Δ1 / Δ2 为本次收紧要求，v0.1 尚未完整实现。其他流程缺口见规则映射清单。</text>
<text x="128.0" y="1920.0" dominant-baseline="central" text-anchor="start" font-size="24.0" fill="#34485e" font-weight="400" text-decoration="none">N03  创建订单可无明细；完成时至少一条；完成后固定交易内容。</text>
<text x="128.0" y="1972.8" dominant-baseline="central" text-anchor="start" font-size="24.0" fill="#34485e" font-weight="400" text-decoration="none">N04  SPOT 可无会员且不关联预订；PRESALE 必须关联同会员预订，整体提货。</text>
<text x="128.0" y="2025.6000000000001" dominant-baseline="central" text-anchor="start" font-size="24.0" fill="#34485e" font-weight="400" text-decoration="none">N08  员工联系分别表示收银、创建或验收；外键存在不等于业务职责正确。</text>
